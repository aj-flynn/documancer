<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Notification settings</title>
<style>
  body{margin:0;font:16px/1.5 system-ui,"Segoe UI",sans-serif;background:#f4f5f7;color:#1c2430}
  .bar{padding:14px 24px;background:#1f3a5f;color:#fff;font-weight:600}
  main{max-width:640px;margin:0 auto;padding:24px}
  h1{margin:0 0 16px;font-size:26px}
  h2{margin:0 0 4px;font-size:17px}
  section{padding:16px 20px;border:1px solid #d5d9e0;border-radius:8px;background:#fff}
  .row{display:flex;align-items:center;justify-content:space-between;gap:16px;padding:12px 0;border-top:1px solid #e6e9ee}
  .row small{display:block;color:#5a6676}
  input[type=checkbox]{width:20px;height:20px}
  select{font:inherit;padding:6px 8px}
  .hint{margin:12px 0 0;color:#5a6676;font-size:14px}
  a{color:#1f5fae}
</style>
</head>
<body>
<div class="bar">Example app · Settings</div>
<main>
  <h1>Notifications</h1>
  <section>
    <h2>Email</h2>
    <label class="row"><span>Comments on my documents</span><input type="checkbox" checked></label>
    <label class="row"><span>Weekly summary</span><input type="checkbox" checked></label>
    <label class="row" data-change="pause" data-when="q1=1a"><span><strong>Pause all email</strong><small>Nothing is sent until you turn this off.</small></span><input type="checkbox"></label>
    <label class="row" data-change="pause" data-when="q1=1b"><span><strong>Pause all email</strong><small>Email starts again by itself on the day you pick.</small></span><input type="checkbox" checked></label>
    <label class="row" data-change="until" data-when="q1=1b"><span>Start again on</span><select><option>Tomorrow</option><option>Next Monday</option><option>In two weeks</option></select></label>
    <p class="hint" data-change="hint">Email that would have been sent while paused is not sent later. <a href="https://example.com/help/notifications">How pausing works</a></p>
  </section>
</main>
</body>
</html>
